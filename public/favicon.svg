<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <!-- Candlestick wicks -->
  <line x1="8" y1="5" x2="8" y2="27" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="16" y1="4" x2="16" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="6" x2="24" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Bearish candle (red) -->
  <rect x="5" y="9" width="6" height="10" rx="1" fill="#ef4444"/>
  <!-- Bullish candle (green) -->
  <rect x="13" y="8" width="6" height="12" rx="1" fill="#22c55e"/>
  <!-- Bearish candle (red) -->
  <rect x="21" y="11" width="6" height="9" rx="1" fill="#ef4444"/>
  <!-- Trend line -->
  <polyline points="6,22 14,14 22,17 30,10" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
