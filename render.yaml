services:
  # ── Frontend + Backend (Hono + tRPC + React) ──────────────────────────────
  - type: web
    name: trademind-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/boot.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: APP_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: OWNER_UNION_ID
        sync: false
      - key: AI_AGENT_API_URL
        sync: false

  # ── AI Agent (FastAPI + Python) ───────────────────────────────────────────
  - type: web
    name: trademind-ai-agent
    runtime: python
    rootDir: ai-agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
